name: sky4all
description: Sky4All — In-flight passenger & crew steward application implemented in Flutter Dart, synced with Ditto Big Peer and SQL Server Management Studio 22.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ditto_live: ^4.8.0
  http: ^1.2.1
  provider: ^6.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
