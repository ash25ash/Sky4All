    function normalizeSeat(seat) {
      if (!seat) return "";
      const s = String(seat).trim().toUpperCase();
      const m = s.match(/^([A-F])(\d+)$/);
      if (m) return `${m[2]}${m[1]}`;
      return s;
    }

    function seatsMatch(a, b) {
      return normalizeSeat(a) === normalizeSeat(b);
    }

    function normalizeNameWords(str) {
      return String(str || "").trim().toLowerCase().split(/\s+/).filter(Boolean).sort().join(" ");
    }

        p.flightDate === normDate &&
        normalizeSeat(p.seat) === normSeat

    const store = {
      passengers: new Map(),
      requests: new Map(),

    let counter = 0;
    function nextId(prefix) {
      counter += 1;
      return `${prefix}_${Date.now().toString(36)}_${counter}`;
    }

    function insert(col, doc) {
      const id = doc.id || nextId(col);
      const record = { ...doc, id };
      store[col].set(id, record);
      pushToDittoBigPeer(col, record);
      render();
      return id;
    }

    function update(col, id, patch) {
      const cur = store[col].get(id);
      if (!cur) return;
      const updated = { ...cur, ...patch };
      store[col].set(id, updated);
      pushToDittoBigPeer(col, updated);
      render();
    }

    function all(col) {
      return Array.from(store[col].values());
    }

    async function pushToDittoBigPeer(col, doc) {
      try {
        await fetch(DITTO_CONFIG.httpDqlEndpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Ditto-Database-Id": DITTO_CONFIG.databaseId
          },
          body: JSON.stringify({
            statement: `INSERT INTO ${col} DOCUMENTS (${JSON.stringify({ _id: doc.id, ...doc })}) ON ID CONFLICT DO UPDATE`
          })
        });
      } catch (_) {}
    }

    function seed() {
      Object.keys(store).forEach(k => store[k].clear());
    }

    function t(key) {
      return (dict[state.lang] && dict[state.lang][key]) || dict.en[key] || key;
    }

    function beep() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (_) {}
    }

    window.setLang = (l) => { state.lang = l; render(); };
    window.setAppMode = (m) => { state.appMode = m; render(); };

    window.toggleCondition = (c) => {
      if (c === "none") {
        state.pConditions = ["none"];
      } else {
        state.pConditions = state.pConditions.filter(x => x !== "none");
        if (state.pConditions.includes(c)) {
          state.pConditions = state.pConditions.filter(x => x !== c);
        } else {
          state.pConditions.push(c);
        }
      }
      render();
    };

    window.toggleAllergy = (enName) => {
      if (state.pAllergies.includes(enName)) {
        state.pAllergies = state.pAllergies.filter(x => x !== enName);
      } else {
        state.pAllergies.push(enName);
      }
      render();
    };

    window.finishProfile = (skip) => {
      if (!skip && state.pSeat && state.pFlightId) {
        const verified = verifyPassenger(
          state.pName,
          state.pFlightId,
          state.pFlightDay || "31/10/2026",
          state.pSeat
        );
        const conds = state.pConditions.filter(c => c !== "none").map(c => {
          if (c !== "allergies") return t(c);
          const list = state.pAllergies.filter(a => a !== "Other").map(a => ALLERGIES.find(x => x.en === a)[state.lang]);
          if (state.pAllergies.includes("Other") && state.pOtherAllergy.trim()) {
            list.push(state.pOtherAllergy.trim());
          }
          return list.length ? `${t(c)}: ${list.join(", ")}` : t(c);
        });
        insert("passengers", {
          ...(verified ? { id: verified.id } : {}),
          name: verified ? verified.name : (state.pName.trim() || "Anonymous"),
          seat: state.pSeat,
          flightId: state.pFlightId,
          flightDate: state.pFlightDay || "31/10/2026",
          medicalConditions: conds.length ? conds : (verified ? verified.medicalConditions : [])
        });
      }
      state.pProfileDone = true;
      render();
    };

    window.sendMedicalEmergency = (emergencyText) => {
      if (!state.pSeat || !emergencyText) return;
      state.pConfirmingEmergency = false;
      state.pOtherEmergency = "";
      beep();
      insert("requests", {
        type: "medical_emergency",
        seat: state.pSeat,
        payload: {
          emergency: emergencyText,
          conditions: state.pConditions.filter(c => c !== "none").map(c => t(c))
        },
        status: "new",
        createdAt: Date.now()
      });

    window.callStewardAction = () => {
      if (!state.pSeat) return;
      insert("requests", {
        type: "call_steward",
        seat: state.pSeat,
        status: "new",
        createdAt: Date.now()
      });
    };

    window.setPassengerView = (v) => {
      state.pView = v;
      if (v === "order") state.pOrderSent = false;
      if (v === "rate") state.pRateDone = false;
      render();
    };

    window.bumpCart = (name, delta) => {
      const cur = state.pCart[name] || 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) delete state.pCart[name];
      else state.pCart[name] = next;
      render();
    };

    window.sendOrderAction = () => {
      if (!state.pSeat) return;
      const entries = Object.entries(state.pCart).filter(([, q]) => q > 0);
      if (!entries.length) return;
      const orderItems = entries.map(([name, qty]) => ({ name, qty }));
      insert("orders", { seat: state.pSeat, items: orderItems, status: "new", createdAt: Date.now() });
      insert("requests", { type: "order", seat: state.pSeat, payload: { items: orderItems }, status: "new", createdAt: Date.now() });
      state.pOrderSent = true;
      render();
    };

      if (!state.pSeat) return;
      insert("flightRatings", {
        seat: state.pSeat,
        turbulence: state.pRateScores.turbulence || 3,
        staffBehaviour: state.pRateScores.staffBehaviour || 3,
        cleanliness: state.pRateScores.cleanliness || 3,
        legroom: state.pRateScores.legroom || 3,
        bagSpace: state.pRateScores.bagSpace || 3,
        ...(state.pRateComment ? { comment: state.pRateComment } : {}),
        createdAt: Date.now()
      });
      state.pRateDone = true;
      render();
      setTimeout(() => {
        state.pRateDone = false;
        state.pView = "home";
        render();
      }, 1500);

      if (!state.pComplaintSeat || !state.pSeat) return;
      insert("seatComplaints", {
        fromSeat: state.pSeat,
        targetSeat: state.pComplaintSeat,
        category: state.pComplaintCategory,
        text: state.pComplaintText,
        createdAt: Date.now()
      });
      insert("requests", {
        type: "complaint",
        seat: state.pSeat,
        payload: {
          targetSeat: state.pComplaintSeat,
          category: state.pComplaintCategory,
          text: state.pComplaintText

        status: "new",
        createdAt: Date.now()
      });
      state.pComplaintSeat = null;
      state.pComplaintText = "";
      render();

    window.loginSteward = () => {
      if (state.sUsername.trim() === REGISTERED_STEWARD.username &&
          state.sPassword.trim() === REGISTERED_STEWARD.password) {
        state.sLoggedIn = true;
        state.sLoginError = "";
        state.sFlightNumber = REGISTERED_STEWARD.flightNumber;
        state.sFlightDate = REGISTERED_STEWARD.flightDate;
      } else {
        state.sLoginError = t("invalidCredentials");
      }
      render();
    };

    window.logoutSteward = () => {
      state.sLoggedIn = false;
      state.sFlightNumber = "";
      state.sFlightDate = "";
      state.sUsername = "";
      state.sPassword = "";
      render();
    };

    window.advanceItem = (col, id, status) => {
      const nextMap = { new: "seen", seen: "in_progress", in_progress: "resolved", resolved: null };
      const n = nextMap[status];
      if (n) update(col, id, { status: n });
    };

    window.updateItemStatus = (col, id, newStatus) => {
      update(col, id, { status: newStatus });
    };

    window.submitPassengerRating = () => {
      if (!state.sSelectedSeat) return;
      insert("passengerRatings", {
        seat: state.sSelectedSeat,
        score: Number(state.sPaxScore) || 3,
        note: state.sPaxNote,
        createdAt: Date.now()
      });
      state.sPaxNote = "";
      render();
    };

    window.startEndFlightUpload = async () => {
      state.sUploadProgress = 0;
      render();
      const cols = ["passengers", "requests", "orders", "flightRatings", "seatComplaints", "passengerRatings"];
      for (const col of cols) {
        for (const item of all(col)) {
          await pushToDittoBigPeer(col, item);
        }
      }
      try {
        await fetch(`${DITTO_CONFIG.sqlBridgeEndpoint}/post-flight`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            databaseId: DITTO_CONFIG.databaseId,
            cloudUrlEndpoint: DITTO_CONFIG.cloudUrlEndpoint,
            flightNumber: "BA123",
            flightDate: "31/10/2026",
            collections: {
              passengers: all("passengers"),
              requests: all("requests"),
              orders: all("orders"),
              flightRatings: all("flightRatings"),
              seatComplaints: all("seatComplaints"),
              passengerRatings: all("passengerRatings")
            }
          })
        });
      } catch (_) {}

      const interval = setInterval(() => {
        state.sUploadProgress = Math.min(100, (state.sUploadProgress || 0) + 10);
        render();
        if (state.sUploadProgress >= 100) clearInterval(interval);
      }, 100);
    };

    function renderSeatMap(getStatusFn, onClickFnName, selectedSeat) {
      const letters = ["A", "B", "C", "D", "E", "F"];
      let rowsHtml = "";
      for (let r = 1; r <= 30; r++) {
        const leftSeats = letters.slice(0, 3).map(l => renderSingleSeat(`${r}${l}`, l, getStatusFn, onClickFnName, selectedSeat)).join("");
        const rightSeats = letters.slice(3).map(l => renderSingleSeat(`${r}${l}`, l, getStatusFn, onClickFnName, selectedSeat)).join("");
        rowsHtml += `
          <div class="grid grid-cols-[repeat(3,auto)_1.25rem_repeat(3,auto)] items-center gap-1">
            ${leftSeats}
            <span class="text-center font-semibold text-muted-foreground text-[8px]">${r}</span>
            ${rightSeats}
          </div>
        `;
      }
      return `
        <div class="flex flex-col items-center gap-1">
          <div class="mb-1 grid grid-cols-[repeat(3,auto)_1.25rem_repeat(3,auto)] gap-1 text-[8px] font-bold text-muted-foreground">
            ${letters.slice(0, 3).map(l => `<span class="flex h-6 w-6 items-center justify-center">${l}</span>`).join("")}
            <span></span>
            ${letters.slice(3).map(l => `<span class="flex h-6 w-6 items-center justify-center">${l}</span>`).join("")}
          </div>
          ${rowsHtml}
        </div>
      `;
    }

    function renderSingleSeat(seatCode, letter, getStatusFn, onClickFnName, selectedSeat) {
      const st = getStatusFn(seatCode);
      const isSelected = selectedSeat && seatsMatch(selectedSeat, seatCode);
      const classes = {
        ok: "bg-seat-ok text-seat-ok-foreground",
        minor: "bg-seat-minor text-seat-minor-foreground",
        urgent: "bg-seat-urgent text-seat-urgent-foreground animate-pulse-red",
        own: "bg-seat-own text-seat-own-foreground ring-2 ring-white/50",
        idle: "bg-muted text-muted-foreground"
      }[st] || "bg-muted text-muted-foreground";

      return `
        <button type="button" onclick="${onClickFnName}('${seatCode}')"
          class="flex h-6 w-6 text-[9px] items-center justify-center rounded-md font-bold transition-transform hover:scale-110 ${classes} ${isSelected ? 'ring-2 ring-foreground' : ''}">
          ${letter}
        </button>
      `;

          .filter(r => seatsMatch(r.seat, state.pSeat))
          .sort((a,b) => b.createdAt - a.createdAt);

        const statusLabel = { new: "statusSent", seen: "statusSeen", in_progress: "statusInProgress", resolved: "statusResolved" };
        const statusColor = {
          new: "bg-secondary text-secondary-foreground",
          seen: "bg-accent text-accent-foreground",
          in_progress: "bg-seat-minor text-seat-minor-foreground",
          resolved: "bg-seat-ok text-seat-ok-foreground"
        };
        const typeLabel = (tp) => tp === "medical_emergency" ? "medicalEmergency" : tp === "call_steward" ? "callSteward" : tp === "order" ? "orderSnacks" : "complaints";

        content = `
          <div class="flex flex-col gap-3">
            <button onclick="state.pConfirmingEmergency=!state.pConfirmingEmergency;render()"
              class="flex items-center gap-3 rounded-2xl bg-destructive px-5 py-5 text-left text-lg font-extrabold text-destructive-foreground shadow-sm">
              <span>⚠️</span>
              <span>${t("medicalEmergency")}</span>
            </button>
            ${state.pConfirmingEmergency ? `
              <div class="flex flex-col gap-2 rounded-2xl border-2 border-destructive bg-card p-3 shadow-sm">
                <p class="text-xs font-bold uppercase tracking-wide text-destructive">${ro ? "Ce se întâmplă?" : "What is happening?"}</p>
                <div class="grid grid-cols-2 gap-2">
                  ${EMERGENCIES.map(e => `
                    <button onclick="sendMedicalEmergency('${e[state.lang]}')"
                      class="rounded-xl bg-destructive/10 px-3 py-3 text-left text-sm font-bold text-destructive">
                      ${e[state.lang]}
                    </button>
                  `).join("")}
                </div>
                <div class="flex gap-2">
                  <input value="${state.pOtherEmergency}" oninput="state.pOtherEmergency=this.value"
                    placeholder="${ro ? 'Altele...' : 'Other...'}"
                    class="min-w-0 flex-1 rounded-xl border border-input bg-background px-3 py-2 text-sm" />
                  <button onclick="sendMedicalEmergency(state.pOtherEmergency.trim())"
                    class="rounded-xl bg-destructive px-4 py-2 text-sm font-bold text-destructive-foreground">
                    ${t("send")}
                  </button>
                </div>
              </div>
            ` : ""}
            <button onclick="callStewardAction()"
              class="flex items-center gap-3 rounded-2xl bg-card px-5 py-5 text-left text-lg font-bold shadow-sm">
              <span class="text-primary">🔔</span>
              <span>${t("callSteward")}</span>
            </button>
            <button onclick="setPassengerView('order')"
              class="flex items-center gap-3 rounded-2xl bg-card px-5 py-5 text-left text-lg font-bold shadow-sm">
              <span class="text-primary">🛒</span>
              <span>${t("orderSnacks")}</span>
            </button>
            <button onclick="setPassengerView('rate')"
              class="flex items-center gap-3 rounded-2xl bg-card px-5 py-5 text-left text-lg font-bold shadow-sm">
              <span class="text-primary">⭐</span>
              <span>${t("rateFlight")}</span>
            </button>
            <button onclick="setPassengerView('seatmap')"
              class="flex items-center gap-3 rounded-2xl bg-card px-5 py-5 text-left text-lg font-bold shadow-sm">
              <span class="text-primary">💬</span>
              <span>${t("complaints")}</span>
            </button>

            ${myRequests.length > 0 ? `
              <div class="mt-2 rounded-2xl bg-card p-4 shadow-sm">
                <h3 class="mb-2 text-sm font-bold">${t("yourRequests")}</h3>
                <ul class="flex flex-col gap-2">
                  ${myRequests.map(r => `
                    <li class="flex items-center justify-between gap-2 text-sm">
                      <span class="font-semibold">${t(typeLabel(r.type))}</span>
                      <span class="rounded-full px-2.5 py-1 text-[11px] font-bold ${statusColor[r.status]}">${t(statusLabel[r.status])}</span>
                    </li>
                  `).join("")}
                </ul>
              </div>
            ` : ""}
          </div>
        `;
      }

      return `
        <div class="flex min-h-full flex-col gap-3 p-3">
          <div class="flex items-center justify-between">
            <span class="text-base font-extrabold tracking-tight text-primary">${t("appName")}</span>
            ${renderLangSwitcher()}
          </div>
          ${content}
        </div>
      `;
    }

    function renderStewardApp() {
      const ro = state.lang === "ro";
      if (!state.sLoggedIn) {
        return `
          <div class="flex min-h-full flex-col gap-3 p-3">
            <div class="flex items-center justify-between">
              <span class="flex items-center gap-2 text-base font-extrabold tracking-tight text-primary">
                ✈️ ${t("appName")} · ${t("steward")}
              </span>
              ${renderLangSwitcher()}
            </div>
            <div class="flex flex-col gap-3 rounded-2xl bg-card p-5 shadow-sm">
              <h2 class="text-lg font-extrabold text-foreground">${t("stewardLoginTitle")}</h2>
              <label class="flex flex-col gap-1 text-xs font-bold">
                ${t("username")}
                <input value="${state.sUsername}" oninput="state.sUsername=this.value"
                  class="rounded-xl border border-input bg-background px-3 py-2.5 text-sm" />
              </label>
              <label class="flex flex-col gap-1 text-xs font-bold">
                ${t("password")}
                <input type="password" value="${state.sPassword}" oninput="state.sPassword=this.value"
                  class="rounded-xl border border-input bg-background px-3 py-2.5 text-sm" />
              </label>
              ${state.sLoginError ? `<p class="text-xs font-bold text-seat-urgent">${state.sLoginError}</p>` : ""}
              <button onclick="loginSteward()" class="rounded-xl bg-primary px-4 py-3 text-sm font-bold text-primary-foreground">
                ${t("signIn")}
              </button>
            </div>
          </div>
        `;
      }

      const requests = all("requests");
      const orders = all("orders");
      const complaints = all("seatComplaints");
      const ratings = all("flightRatings");
      const passengers = all("passengers");

      const open = requests.filter(r => r.status !== "resolved");
      const urgent = open.filter(r => r.type === "medical_emergency");
      const calls = open.filter(r => r.type === "call_steward");
      const openOrders = orders.filter(o => o.status !== "resolved");

      function avgRating(r) {
        return (r.turbulence + r.staffBehaviour + r.cleanliness + r.legroom + r.bagSpace) / 5;
      }

      function getStatus(seatCode) {
        const seatOpen = open.filter(r => seatsMatch(r.seat, seatCode));
        if (seatOpen.some(r => r.type === "medical_emergency" || r.type === "call_steward")) return "urgent";
        if (seatOpen.length > 0 || complaints.some(c => seatsMatch(c.targetSeat, seatCode))) return "minor";
        return "ok";
      }

      const tabs = [
        { id: "urgent", label: t("urgent"), count: urgent.length, alert: urgent.length > 0 },
        { id: "calls", label: t("calls"), count: calls.length },
        { id: "orders", label: t("orders"), count: openOrders.length },
        { id: "complaints", label: t("feedbackTab"), count: complaints.length + ratings.length }
      ];

      function renderStatusBtn(col, id, st) {
        const labels = { new: "markSeen", seen: "startProgress", in_progress: "resolve", resolved: "resolved" };
        if (st === "resolved") {
          return `<span class="rounded-full bg-seat-ok px-2.5 py-1 text-[11px] font-bold text-seat-ok-foreground">${t("resolved")}</span>`;
        }
        return `<button onclick="advanceItem('${col}','${id}','${st}')" class="rounded-full bg-primary px-3 py-1.5 text-[11px] font-bold text-primary-foreground">${t(labels[st])}</button>`;
      }

      function renderRequestRow(r) {
        const lbl = r.type === "medical_emergency" ? "medicalEmergency" : r.type === "call_steward" ? "callSteward" : r.type === "order" ? "orderSnacks" : "complaints";
        const conds = (r.payload && Array.isArray(r.payload.conditions)) ? r.payload.conditions : [];
        const emergency = (r.payload && typeof r.payload.emergency === "string") ? r.payload.emergency : "";
        const ordItems = (r.payload && Array.isArray(r.payload.items)) ? r.payload.items : [];
        const ordTotal = ordItems.length ? formatPrice(cartTotalCents(Object.fromEntries(ordItems.map(i => [i.name, i.qty]))), ro) : "";

        let actionHtml = "";
        if (r.type === "order") {
          actionHtml = r.status === "new"
            ? `<button onclick="updateItemStatus('requests','${r.id}','seen')" class="shrink-0 rounded-full bg-primary px-3 py-1.5 text-[11px] font-bold text-primary-foreground">${t("markSeen")}</button>`
            : `<span class="shrink-0 rounded-full bg-seat-ok px-2.5 py-1 text-[11px] font-bold text-seat-ok-foreground">${t("seen")}</span>`;
        } else if (r.type === "medical_emergency" || r.type === "call_steward") {
          actionHtml = r.status === "resolved"
            ? `<span class="shrink-0 rounded-full bg-seat-ok px-2.5 py-1 text-[11px] font-bold text-seat-ok-foreground">${t("resolved")}</span>`
            : `<button onclick="updateItemStatus('requests','${r.id}','resolved')" class="shrink-0 rounded-full bg-primary px-3 py-1.5 text-[11px] font-bold text-primary-foreground">${t("resolve")}</button>`;
        } else {
          actionHtml = renderStatusBtn("requests", r.id, r.status);
        }

        return `
          <li class="flex items-center justify-between gap-2 rounded-xl px-3 py-2 text-sm ${r.type === 'medical_emergency' ? 'bg-seat-urgent/15' : 'bg-secondary'}">
            <div>
              <span class="font-bold">${r.seat}</span>
              <span class="ml-2 font-semibold">${t(lbl)}</span>
              ${r.type === 'medical_emergency' && emergency ? `<p class="text-sm font-extrabold text-seat-urgent">${emergency}</p>` : ""}
              ${r.type === 'medical_emergency' && conds.length ? `<p class="text-xs font-semibold text-seat-urgent">${conds.join(", ")}</p>` : ""}
              ${r.type === 'order' && ordItems.length ? `
                <p class="text-xs text-muted-foreground">${ordItems.map(i => `${i.qty}× ${i.name}`).join(", ")}</p>
                <p class="font-bold text-primary">Total: ${ordTotal}</p>
              ` : ""}
            </div>
            ${actionHtml}
          </li>
        `;
      }

      let tabListHtml = "";
      if (state.sTab === "urgent") {
        tabListHtml = urgent.length ? `<ul class="flex flex-col gap-2">${urgent.map(renderRequestRow).join("")}</ul>` : `<p class="text-sm text-muted-foreground">${t("emptyTab")}</p>`;
      } else if (state.sTab === "calls") {
        tabListHtml = calls.length ? `<ul class="flex flex-col gap-2">${calls.map(renderRequestRow).join("")}</ul>` : `<p class="text-sm text-muted-foreground">${t("emptyTab")}</p>`;
      } else if (state.sTab === "orders") {
        tabListHtml = openOrders.length ? `<ul class="flex flex-col gap-2">${openOrders.map(o => {
          const total = formatPrice(cartTotalCents(Object.fromEntries(o.items.map(i => [i.name, i.qty]))), ro);
          return `
            <li class="flex items-center justify-between gap-2 rounded-xl bg-secondary px-3 py-2 text-sm">
              <div>
                <span class="font-bold">${o.seat}</span>
                <span class="ml-2 text-muted-foreground">${o.items.map(i => `${i.qty}× ${i.name}`).join(", ")}</span>
                <p class="mt-1 font-bold text-primary">Total: ${total}</p>
              </div>
              ${o.status === "new"
                ? `<button onclick="updateItemStatus('orders','${o.id}','seen')" class="shrink-0 rounded-full bg-primary px-3 py-1.5 text-[11px] font-bold text-primary-foreground">${t("markSeen")}</button>`
                : `<span class="shrink-0 rounded-full bg-seat-ok px-2.5 py-1 text-[11px] font-bold text-seat-ok-foreground">${t("seen")}</span>`}
            </li>
          `;
        }).join("")}</ul>` : `<p class="text-sm text-muted-foreground">${t("emptyTab")}</p>`;
      } else {
        if (!complaints.length && !ratings.length) {
          tabListHtml = `<p class="text-sm text-muted-foreground">${t("emptyTab")}</p>`;
        } else {
          tabListHtml = `
            <ul class="flex flex-col gap-2">
              ${complaints.map(c => `
                <li class="rounded-xl bg-secondary px-3 py-2 text-sm">
                  <span class="font-bold">${c.fromSeat} → ${c.targetSeat}</span>
                  <span class="ml-2 rounded-full bg-seat-minor px-2 py-0.5 text-[10px] font-bold text-seat-minor-foreground">${t(c.category)}</span>
                  ${c.text ? `<p class="mt-1 text-xs text-muted-foreground">${c.text}</p>` : ""}
                </li>
              `).join("")}
            </ul>
            ${ratings.length ? `
              <ul class="mt-2 flex flex-col gap-2">
                ${ratings.map(r => `
                  <li class="rounded-xl bg-secondary px-3 py-2 text-sm">
                    <span class="font-bold">${t("anonymous")}</span>
                    <span class="ml-2 font-bold text-primary">★ ${avgRating(r).toFixed(1)}</span>
                    ${r.comment ? `<p class="mt-1 text-xs text-muted-foreground">“${r.comment}”</p>` : ""}
                  </li>
                `).join("")}
              </ul>
            ` : ""}
          `;
        }
      }

      let seatPanelHtml = "";
      if (state.sSelectedSeat) {
        const s = state.sSelectedSeat;
        const sReqs = requests.filter(r => seatsMatch(r.seat, s));
        const sComps = complaints.filter(c => seatsMatch(c.targetSeat, s));
        const sPax = passengers.find(p => seatsMatch(p.seat, s));
        const sPaxRatings = all("passengerRatings").filter(r => seatsMatch(r.seat, s));

        seatPanelHtml = `
          <div class="flex flex-col gap-3 rounded-2xl bg-card p-4 shadow-sm">
            <div class="flex items-center justify-between">
              <h3 class="text-base font-extrabold">
                ${t("requestsFor")} ${s}
                ${sPax ? `<span class="ml-2 text-sm font-semibold text-muted-foreground">${sPax.name}</span>` : ""}
              </h3>
              <button onclick="state.sSelectedSeat=null;render()" class="text-sm font-bold text-primary">✕</button>
            </div>
            ${sPax && sPax.medicalConditions.length ? `
              <p class="rounded-xl bg-seat-urgent/15 px-3 py-2 text-xs font-bold text-seat-urgent">
                ${t("medicalLabel")}: ${sPax.medicalConditions.join(", ")}
              </p>
            ` : ""}
            ${sReqs.length ? `<ul class="flex flex-col gap-2">${sReqs.map(renderRequestRow).join("")}</ul>` : ""}
            ${sComps.map(c => `<p class="rounded-xl bg-secondary px-3 py-2 text-xs"><span class="font-bold">${t(c.category)}</span> · ${c.fromSeat}: ${c.text}</p>`).join("")}
            <div class="flex flex-col gap-2 rounded-xl border border-border p-3">
              <p class="text-xs font-bold">${t("ratePassenger")}</p>
              <div class="flex items-center gap-2">
                <select onchange="state.sPaxScore=Number(this.value)" class="rounded-lg border border-input bg-background px-2 py-1.5 text-sm">
                  ${[1,2,3,4,5].map(n => `<option value="${n}" ${state.sPaxScore===n?'selected':''}>${n}</option>`).join("")}
                </select>
                <input value="${state.sPaxNote}" oninput="state.sPaxNote=this.value" placeholder="${t("note")}"
                  class="min-w-0 flex-1 rounded-lg border border-input bg-background px-2 py-1.5 text-sm" />
                <button onclick="submitPassengerRating()" class="rounded-lg bg-primary px-3 py-1.5 text-xs font-bold text-primary-foreground">${t("send")}</button>
              </div>
              ${sPaxRatings.map(r => `<p class="text-xs text-muted-foreground">★ ${r.score} — ${r.note}</p>`).join("")}
            </div>
          </div>
        `;
      }

      let endFlightHtml = "";
      if (state.sUploadProgress === null) {
        endFlightHtml = `
          <button onclick="startEndFlightUpload()" class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 text-sm font-bold text-primary-foreground">
            ☁️ ${t("endFlight")}
          </button>
        `;
      } else if (state.sUploadProgress < 100) {
        endFlightHtml = `
          <div>
            <p class="mb-1 text-xs font-semibold text-muted-foreground">${t("uploading")}</p>
            <div class="h-3 overflow-hidden rounded-full bg-secondary">
              <div class="h-full rounded-full bg-primary transition-all" style="width:${state.sUploadProgress}%"></div>
            </div>
          </div>
        `;
      } else {
        endFlightHtml = `
          <p class="rounded-xl bg-seat-ok px-4 py-3 text-center text-sm font-bold text-seat-ok-foreground">
            ${t("uploadComplete")}
          </p>
        `;
      }

      return `
        <div class="flex min-h-full flex-col gap-3 p-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="flex items-center gap-1.5 text-base font-extrabold tracking-tight text-primary">
                ✈️ ${t("appName")} · ${t("steward")}
              </span>
              <span class="rounded-full bg-seat-ok px-2.5 py-0.5 text-[11px] font-extrabold text-seat-ok-foreground">
                ${state.sFlightNumber} · ${state.sFlightDate}
              </span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="logoutSteward()" class="rounded-full border border-border bg-card px-2 py-1 text-[10px] font-bold text-primary">Sign Out</button>
              ${renderLangSwitcher()}
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 rounded-xl border border-border bg-card p-2.5">
            <label class="flex flex-col gap-0.5 text-[10px] font-bold text-muted-foreground">
              ${t("flightNumberLabel")}
              <input value="${state.sFlightNumber}" readonly class="rounded-lg border border-input bg-background px-2.5 py-1.5 text-xs font-bold text-foreground" />
            </label>
            <label class="flex flex-col gap-0.5 text-[10px] font-bold text-muted-foreground">
              ${t("flightDateLabel")}
              <input value="${state.sFlightDate}" readonly class="rounded-lg border border-input bg-background px-2.5 py-1.5 text-xs font-bold text-foreground" />
            </label>
          </div>

          <div class="grid grid-cols-4 gap-2">
            ${tabs.map(tb => `
              <button onclick="state.sTab='${tb.id}';render()"
                class="relative rounded-xl px-2 py-2.5 text-xs font-bold shadow-sm transition-colors ${state.sTab === tb.id ? 'bg-primary text-primary-foreground' : 'bg-card text-foreground'} ${tb.alert ? 'animate-pulse-red' : ''}">
                ${tb.label}
                <span class="absolute -top-1.5 -right-1.5 flex h-5 min-w-[1.25rem] items-center justify-center rounded-full px-1 text-[10px] font-extrabold ${tb.alert ? 'bg-seat-urgent text-seat-urgent-foreground' : 'bg-secondary text-secondary-foreground'}">
                  ${tb.count}
                </span>
              </button>
            `).join("")}
          </div>

          <div class="grid flex-1 gap-3 lg:grid-cols-[auto_1fr]">
            <div class="overflow-y-auto rounded-2xl bg-card p-3 shadow-sm">
              ${renderSeatMap(getStatus, "onStewardSeatClick", state.sSelectedSeat)}
            </div>
            <div class="flex flex-col gap-3">
              <div class="rounded-2xl bg-card p-3 shadow-sm">
                ${tabListHtml}
              </div>
              ${seatPanelHtml}
              <div class="rounded-2xl bg-card p-3 shadow-sm">
                ${endFlightHtml}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSimulatePanel() {
      return `
        <div class="flex flex-wrap items-center justify-center gap-2 rounded-2xl bg-card p-3 shadow-sm">
          <span class="mr-1 text-xs font-extrabold uppercase tracking-wide text-muted-foreground">${t("simulate")}</span>
          <button onclick="simMedical()" class="rounded-full bg-seat-urgent px-3 py-2 text-xs font-bold text-seat-urgent-foreground">${t("simMedical")}</button>
          <button onclick="simCall()" class="rounded-full bg-secondary px-3 py-2 text-xs font-bold text-secondary-foreground hover:bg-accent">${t("simCall")}</button>
          <button onclick="simOrder()" class="rounded-full bg-secondary px-3 py-2 text-xs font-bold text-secondary-foreground hover:bg-accent">${t("simOrder")}</button>
          <button onclick="simComplaint()" class="rounded-full bg-secondary px-3 py-2 text-xs font-bold text-secondary-foreground hover:bg-accent">${t("simComplaint")}</button>
          <button onclick="simBadReview()" class="rounded-full bg-seat-urgent px-3 py-2 text-xs font-bold text-seat-urgent-foreground">${t("simBadReview")}</button>
          <button onclick="simReset()" class="rounded-full border border-border bg-background px-3 py-2 text-xs font-bold text-foreground">${t("reset")}</button>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      const ro = state.lang === "ro";
      let mainBody = "";
      if (state.appMode === "passenger") {
        mainBody = `
          <div class="mx-auto w-full max-w-[420px] rounded-[2rem] border-8 border-foreground/80 bg-background shadow-xl">
            <div class="h-[82vh] min-h-[540px] overflow-y-auto rounded-[1.6rem]">
              ${renderPassengerApp()}
            </div>
          </div>
        `;
      } else if (state.appMode === "steward") {
        mainBody = `
          <div class="mx-auto w-full max-w-5xl rounded-[1.5rem] border-8 border-foreground/80 bg-background shadow-xl">
            <div class="h-[78vh] min-h-[520px] overflow-y-auto rounded-[1.1rem]">
              ${renderStewardApp()}
            </div>
          </div>
        `;
      } else {
        mainBody = `
          <div class="grid min-w-[760px] flex-1 grid-cols-2 gap-4">
            <section class="flex flex-col gap-2">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold uppercase tracking-wide text-muted-foreground">${t("passenger")}</h2>
              </div>
              <div class="mx-auto w-full max-w-[420px] rounded-[2rem] border-8 border-foreground/80 bg-background shadow-xl">
                <div class="h-[70vh] min-h-[480px] overflow-y-auto rounded-[1.6rem]">
                  ${renderPassengerApp()}
                </div>
              </div>
            </section>
            <section class="flex flex-col gap-2">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-extrabold uppercase tracking-wide text-muted-foreground">${t("steward")}</h2>
                <button onclick="setAppMode('steward')" class="text-xs font-bold text-primary underline">${t("openSteward")}</button>
              </div>
              <div class="rounded-[1.5rem] border-8 border-foreground/80 bg-background shadow-xl">
                <div class="h-[70vh] min-h-[480px] overflow-y-auto rounded-[1.1rem]">
                  ${renderStewardApp()}
                </div>
              </div>
            </section>
          </div>
        `;
      }

      root.innerHTML = `
        <div class="flex min-h-screen flex-col gap-4 overflow-x-auto p-4">
          <header class="flex flex-wrap items-center justify-between gap-2">
            <h1 class="flex items-center gap-2 text-2xl font-extrabold tracking-tight text-primary">
              ✈️ ${t("appName")}
            </h1>
            <div class="flex items-center gap-2">
              <button onclick="setAppMode('split')" class="rounded-full px-3 py-1 text-xs font-bold ${state.appMode==='split' ? 'bg-primary text-primary-foreground' : 'bg-card border border-border'}">Split Demo (/)</button>
              <button onclick="setAppMode('passenger')" class="rounded-full px-3 py-1 text-xs font-bold ${state.appMode==='passenger' ? 'bg-primary text-primary-foreground' : 'bg-card border border-border'}">Passenger App (/p)</button>
              <button onclick="setAppMode('steward')" class="rounded-full px-3 py-1 text-xs font-bold ${state.appMode==='steward' ? 'bg-primary text-primary-foreground' : 'bg-card border border-border'}">Steward App (/s)</button>
            </div>
            <p class="flex items-center gap-2 text-xs font-semibold text-muted-foreground">
              <span class="inline-block h-2 w-2 rounded-full bg-seat-ok"></span>
              Ditto live · ${DITTO_CONFIG.databaseId}
            </p>
          </header>
          ${mainBody}
        </div>
      `;
    }

    seed();
    render();
  </script>
</body>
</html>
